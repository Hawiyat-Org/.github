name: Bug report
description: Something is broken in a Hawiyat service or repository
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: State the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.4.0 or 3f2a1c9
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "S1: production down"
        - "S2: major feature broken"
        - "S3: minor or cosmetic"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and customer data before you paste.
    validations:
      required: false
