name: docker-build

# Build once, sign, attach an SBOM, publish provenance, push by digest.
# Call it from a service repo:
#
#   jobs:
#     image:
#       uses: Hawiyat-Org/.github/.github/workflows/docker-build.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#         security-events: write

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: "."
      push:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ inputs.image-name }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ env.REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "${{ env.REGISTRY }}/${{ inputs.image-name }}:latest" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        if: inputs.push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload scan results
        if: always() && inputs.push
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: trivy.sarif

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.push

      - name: Sign the digest
        if: inputs.push
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

      - name: Attest provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
