name: secret-scan

# Blocks a pull request that adds a credential.
# Uses the gitleaks container so no paid org licence is needed.

on:
  workflow_call:
    inputs:
      extra-args:
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source=/repo --redact --verbose --exit-code=1 \
            --log-opts="--all" ${{ inputs.extra-args }}
